<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark Real-Time Earthquake Case Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --secondary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-main: #f0f0f0;
            --text-muted: #8892b0;
            --accent: #ff4b2b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 65, 108, 0.1), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(0, 198, 255, 0.1), transparent 30%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 4rem 2rem 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 1rem;
            font-weight: 300;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
            position: relative;
            overflow: hidden;
        }

        .card.full-width {
            grid-column: 1 / -1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: var(--secondary-gradient);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        
        .card:nth-child(1)::before { background: var(--primary-gradient); }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-value {
            font-size: 4rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
            line-height: 1;
        }

        .performance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .perf-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .perf-box h3 {
            margin: 0 0 10px 0;
            color: var(--text-muted);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .perf-box .time {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .region-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .region-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        
        .region-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .region-item .count {
            background: var(--primary-gradient);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        
        .loading-text {
            margin-top: 25px;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 3px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.3s; }
        .card:nth-child(3) { animation-delay: 0.5s; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div class="loading-text">FETCHING USGS REAL-TIME DATA</div>
    </div>

    <header>
        <h1>Global Earthquake Analysis</h1>
        <p class="subtitle">PySpark Distributed Processing • Real-Time Case Study</p>
    </header>

    <div class="container" id="dashboard" style="display: none;">
        
        <div class="card">
            <h2>Total Global Earthquakes (Last 30 Days)</h2>
            <div class="stat-value" id="totalRecords">0</div>
        </div>

        <div class="card">
            <h2>Spark Performance Benchmarks</h2>
            <div class="performance-grid">
                <div class="perf-box">
                    <h3>Cached Execution</h3>
                    <div class="time" id="timeCached">0s</div>
                </div>
                <div class="perf-box">
                    <h3>Uncached Execution</h3>
                    <div class="time" id="timeUncached">0s</div>
                </div>
            </div>
        </div>

        <div class="card full-width">
            <h2>Top 10 Most Active Seismic Regions</h2>
            <ul class="region-list" id="regionList">
                <!-- Injected via JS -->
            </ul>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/earthquake-data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        const dashboard = document.getElementById('dashboard');
                        dashboard.style.display = 'grid';
                        
                        // Populate Data
                        document.getElementById('totalRecords').innerText = data.total_records.toLocaleString();
                        document.getElementById('timeCached').innerText = data.time_cached + 's';
                        document.getElementById('timeUncached').innerText = data.time_uncached + 's';
                        
                        const listEl = document.getElementById('regionList');
                        data.top_regions.forEach(r => {
                            const li = document.createElement('li');
                            li.className = 'region-item';
                            li.innerHTML = `
                                <span>${r.region}</span>
                                <span class="count">${r.count.toLocaleString()}</span>
                            `;
                            listEl.appendChild(li);
                        });
                        
                    }, 500);
                })
                .catch(err => {
                    document.getElementById('loader').innerHTML = `<div style="color: #ff4757; text-align:center;"><h2>Backend Error</h2>${err}</div>`;
                });
        });
    </script>
</body>
</html>
